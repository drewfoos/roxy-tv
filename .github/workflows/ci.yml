name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./... # the runner has a C compiler, which -race needs
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/roxy ./cmd/roxy

  integration:
    # The tests the server job skips: they need ffmpeg (real videos are made, probed and
    # extracted) and a non-root user (the runner's), and ROXY_REQUIRE_INTEGRATION makes
    # them fail instead of skip if either is missing, so a green job means they ran.
    name: Server integration (ffmpeg, non-root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: test "$(id -u)" != 0 && ffprobe -version | head -1
      - run: go test -race -count=1 -v -run 'TestLibraryLifecycle|TestMKSSidecarTracks' ./internal/library
        env:
          ROXY_REQUIRE_INTEGRATION: "1"

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
