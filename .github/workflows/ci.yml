name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: | # the runner has a C compiler, which -race needs
          set -o pipefail
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The failing lines as annotations: the public API serves those without a login,
      # unlike the job's log (so they can be read where there is no GitHub token).
      - if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+:|DATA RACE|^panic:|^FAIL' "$RUNNER_TEMP/test.log" | head -40 | sed 's/^/::error::/'
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/roxy ./cmd/roxy

  integration:
    # The tests the server job skips: they need ffmpeg (real videos are made, probed and
    # extracted) and a non-root user (the runner's), and ROXY_REQUIRE_INTEGRATION makes
    # them fail instead of skip if either is missing, so a green job means they ran.
    name: Server integration (ffmpeg, non-root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: test "$(id -u)" != 0 && ffprobe -version | head -1
      - run: |
          set -o pipefail
          go test -race -count=1 -v -run 'TestLibraryLifecycle|TestMKSSidecarTracks|TestLegacyMergedFilmsSplitByScan' ./internal/library 2>&1 | tee "$RUNNER_TEMP/test.log"
          go test -race -count=1 -v -run 'TestPlaybackOverHTTP' ./internal/api 2>&1 | tee -a "$RUNNER_TEMP/test.log"
        env:
          ROXY_REQUIRE_INTEGRATION: "1"
      - if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+:|DATA RACE|^panic:|^FAIL' "$RUNNER_TEMP/test.log" | head -40 | sed 's/^/::error::/'

  upgrade:
    # An independent check of upgrades: an OLD release's own build scans a library and its
    # database gets watch history, then this build opens it and rescans. The migration
    # tests build "old" databases from this checkout's migration files, so they cannot see
    # an old migration edited by mistake (migrations.lock guards that) or an old release
    # that read files differently. Pinned releases: 0.4.6 (schema 0021) and schema 0028.
    name: Upgrade from older releases
    runs-on: ubuntu-latest
    strategy:
      matrix:
        old: [e49bc590da812c41b60e888b72690da57d70b7a9, b29a1339048a8497a6de84733127f6174df5fe7f]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.old }}
          path: old-release
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: scripts/upgrade-from-release.sh ../old-release "$RUNNER_TEMP/upgrade"
        env:
          ROXY_REQUIRE_INTEGRATION: "1"

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
