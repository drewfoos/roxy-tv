name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: | # the runner has a C compiler, which -race needs
          set -o pipefail
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The failing lines as annotations: the public API serves those without a login,
      # unlike the job's log (so they can be read where there is no GitHub token).
      - if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+:|DATA RACE|^panic:|^FAIL' "$RUNNER_TEMP/test.log" | head -40 | sed 's/^/::error::/'
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/roxy ./cmd/roxy

  integration:
    # The tests the server job skips: they need ffmpeg (real videos are made, probed and
    # extracted) and a non-root user (the runner's), and ROXY_REQUIRE_INTEGRATION makes
    # them fail instead of skip if either is missing, so a green job means they ran.
    name: Server integration (ffmpeg, non-root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: test "$(id -u)" != 0 && ffprobe -version | head -1
      - run: |
          set -o pipefail
          go test -race -count=1 -v -run 'TestLibraryLifecycle|TestMKSSidecarTracks|TestLegacyMergedFilmsSplitByScan' ./internal/library 2>&1 | tee "$RUNNER_TEMP/test.log"
          go test -race -count=1 -v -run 'TestPlaybackOverHTTP' ./internal/api 2>&1 | tee -a "$RUNNER_TEMP/test.log"
        env:
          ROXY_REQUIRE_INTEGRATION: "1"
      - if: failure()
        run: grep -E -- '--- FAIL|_test\.go:[0-9]+:|DATA RACE|^panic:|^FAIL' "$RUNNER_TEMP/test.log" | head -40 | sed 's/^/::error::/'

  upgrade:
    # An independent check of upgrades: an OLD release's own build scans a library and its
    # database gets watch history, then this build opens it and rescans. The migration
    # tests build "old" databases from this checkout's migration files, so they cannot see
    # an old migration edited by mistake (migrations.lock guards that) or an old release
    # that read files differently. Pinned releases: 0.4.6 (schema 0021) and schema 0028.
    name: Upgrade from older releases
    runs-on: ubuntu-latest
    strategy:
      matrix:
        old: [e49bc590da812c41b60e888b72690da57d70b7a9, b29a1339048a8497a6de84733127f6174df5fe7f]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.old }}
          path: old-release
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: scripts/upgrade-from-release.sh ../old-release "$RUNNER_TEMP/upgrade"
        env:
          ROXY_REQUIRE_INTEGRATION: "1"

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  web-player:
    # The web player in real Google Chrome (the runner has it; Playwright's own Chromium
    # has no H.264/AAC) against a server built from this commit: a remux stream cut
    # part-way must be reopened where it got to, not count as the end of the film. See
    # apps/web/e2e/stream-cut.mjs. Loopback is throttled so the stream is still arriving
    # when it is cut (over plain loopback a remux arrives whole in seconds).
    name: Web player in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/roxy" ./cmd/roxy
        working-directory: server
      - name: A 5-minute film with AC3 audio (the browser cannot play it, so the player remuxes)
        run: |
          mkdir -p "$RUNNER_TEMP/media/Film (2020)"
          ffmpeg -v error -y -f lavfi -i testsrc2=duration=300:size=1280x720:rate=24 -f lavfi -i sine=frequency=440:duration=300 \
            -c:v libx264 -preset ultrafast -b:v 2500k -g 48 -c:a ac3 -b:a 192k "$RUNNER_TEMP/media/Film (2020)/Film (2020).mkv"
      - name: Start the server
        run: |
          ROXY_LISTEN=127.0.0.1:18097 ROXY_DISCOVERY_PORT=18096 ROXY_DATA_DIR="$RUNNER_TEMP/data" ROXY_MEDIA_ROOTS="$RUNNER_TEMP/media" \
            ROXY_HWACCEL=none ROXY_ADMIN_USER=roxy ROXY_ADMIN_PASSWORD=e2e-password-123 nohup "$RUNNER_TEMP/roxy" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:18097/healthz >/dev/null && exit 0; sleep 1; done; cat "$RUNNER_TEMP/server.log"; exit 1
      - run: sudo tc qdisc add dev lo root tbf rate 8mbit burst 128kb latency 500ms
      - run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        working-directory: apps/web
        env:
          BASE: http://127.0.0.1:18097
          ROXY_USER: roxy
          ROXY_PASS: e2e-password-123
          CUT_CMD: pkill -f -- "-c:v copy"
      - if: failure()
        run: |
          grep -E "FAIL|cut:|reopened|Error" "$RUNNER_TEMP/e2e.log" | head -20 | sed 's/^/::error::/'
          grep -E "remux|level=ERROR" "$RUNNER_TEMP/server.log" | tail -10 | sed 's/^/::error::server: /'

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
