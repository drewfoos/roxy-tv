name: Security

# Known holes in what Roxy is built from: the Go standard library and modules, the web
# app's packages, and the server image's system packages (Debian's, and the ffmpeg build
# it carries). Every week, on every change to what is depended on, and by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - server/go.mod
      - server/go.sum
      - apps/web/package-lock.json
      - deploy/Dockerfile
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Only what the server's own code can reach counts: a hole in a function nothing
      # calls is listed, not failed on.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # What ships in the browser app; build and test tools are Dependabot's to keep fresh.
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Server image (system packages, ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -f deploy/Dockerfile -t roxy:scan .
      # Holes that have a fix: rebuilding on fresh base images, or raising the ffmpeg
      # version in the Dockerfile, clears them. Ones nobody has fixed yet are not failed on.
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress roxy:scan
