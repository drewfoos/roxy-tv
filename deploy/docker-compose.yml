# Roxy Server. Point the /data volume at your library and list its folders in
# ROXY_MEDIA_ROOTS (example: /data/media/{movies,tv}). Roxy only reads media.
#
# Roxy keeps Jellyfin's port (8096) so request app, Sonarr and Radarr only need a new
# host/token when switching over. Run both side by side on different ports first
# (e.g. "8097:8096" while Jellyfin still has 8096).
#
# Compose builds the image from this repo (server and web app together):
#   cd roxy/deploy && docker compose up -d --build roxy
# AMD / Intel (VAAPI, /dev/dri) is the default below. For an NVIDIA card add the override:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d --build roxy
# Check which encoder was picked:  docker logs roxy 2>&1 | grep "transcode: encoder"

x-common: &common
  restart: unless-stopped
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: "America/Los_Angeles"

services:
  roxy:
    <<: *common
    image: roxy-server:latest
    build:
      context: ..                    # the repo root (the Dockerfile copies server/ and deploy/)
      dockerfile: deploy/Dockerfile
    container_name: roxy
    ports:
      - "8096:8096"
      # LAN discovery beacon. Docker's port mapping does not forward broadcasts, so on this
      # bridge network the apps find the server by their HTTP sweep instead; for the
      # broadcast to work too, use `network_mode: host` and drop `ports:`.
      - "8096:8096/udp"
    volumes:
      - ./config/roxy:/config        # roxy.db + caches (ROXY_DATA_DIR=/config in the image)
      - /data:/data:ro               # your library; Roxy only reads media
      - ./fonts:/fonts:ro            # optional extra fonts (ROXY_FONTS_DIR)
    devices:
      # RX 550 (or Intel iGPU): VAAPI transcodes via jellyfin-ffmpeg's bundled radeonsi/iHD
      # drivers. The entrypoint joins the groups that own these nodes, so no group_add.
      - /dev/dri:/dev/dri
    environment:
      # Repeated from x-common: a service's own `environment:` replaces the merged one.
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
      ROXY_MEDIA_ROOTS: "/data/media/movies,/data/media/tv"
      # auto tries NVENC, Quick Sync, VAAPI, AMF, then software x264 with a 1 s test
      # encode at startup. Force one with nvenc | qsv | vaapi | amf | none.
      ROXY_HWACCEL: "auto"
      # ROXY_VAAPI_DEVICE: "/dev/dri/renderD128"   # if the AMD card is not the first render node
      # Leave the password unset and the first person to open http://<server>:8096/ (or the
      # app) from the home network creates the admin in the setup wizard. Set it to skip
      # the wizard: the admin is then created at the first start.
      ROXY_ADMIN_USER: "${ROXY_ADMIN_USER:-roxy}"
      ROXY_ADMIN_PASSWORD: "${ROXY_ADMIN_PASSWORD:-}"
      # ROXY_ADVERTISE_URL: "http://192.168.1.10:8096"  # what clients should use if the LAN address is wrong
      ROXY_TMDB_API_KEY: "${TMDB_API_KEY:-}" # or enter it in the setup wizard (free key from themoviedb.org)
      # Optional: Sonarr / Radarr for Discover requests (or set them up in the app).
      # ROXY_SONARR_URL: "http://sonarr:8989"
      # ROXY_SONARR_API_KEY: "${SONARR_API_KEY}"
      # ROXY_RADARR_URL: "http://radarr:7878"
      # ROXY_RADARR_API_KEY: "${RADARR_API_KEY}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Transcodes stream Matroska straight to the client (no temp segments), so there is
    # no /transcode volume or tmpfs.
    #
    # NVIDIA alternative (instead of `devices:` above; docker-compose.nvidia.yml does this).
    # Needs the NVIDIA driver + nvidia-container-toolkit on the host. The `video`
    # capability is what exposes NVENC; without it the encoder test fails and Roxy falls
    # back to software.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
