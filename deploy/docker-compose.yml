# Reference stack: Roxy Server alongside the arr apps.
# Assumes the TRaSH layout: /data/torrents/{movies,tv} and /data/media/{movies,tv}
# on one filesystem so Sonarr/Radarr hardlinks work.
#
# Roxy keeps Jellyfin's port (8096) so request app, Sonarr and Radarr only need a new
# host/token when switching over. Run both side by side on different ports first.

x-common: &common
  restart: unless-stopped
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: "America/Los_Angeles"

services:
  roxy:
    <<: *common
    image: ghcr.io/roxy-media/roxy-server:latest
    container_name: roxy
    ports:
      - "8096:8096"
      - "8096:8096/udp"            # LAN discovery: the apps' login screen finds the server by broadcast
    volumes:
      - ./config/roxy:/config
      - /data:/data:ro
      - ./fonts:/fonts:ro            # optional extra fonts for burn-in and client fallback
    devices:
      - /dev/dri:/dev/dri            # RX 550: VAAPI/AMF for fallback transcodes
    group_add:
      - "video"
      - "render"
    tmpfs:
      - /transcode:size=4g           # HLS segments for fallback transcodes
    environment:
      ROXY_MEDIA_ROOTS: "/data/media/movies,/data/media/tv"
      ROXY_HWACCEL: "vaapi"          # auto | vaapi | amf | qsv | nvenc | none
      ROXY_TMDB_API_KEY: "${TMDB_API_KEY:-}" # or drop a tmdb.key file in the data volume; release images carry a project default
      ROXY_SONARR_URL: "http://sonarr:8989"
      ROXY_SONARR_API_KEY: "${SONARR_API_KEY}"
      ROXY_RADARR_URL: "http://radarr:7878"
      ROXY_RADARR_API_KEY: "${RADARR_API_KEY}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- existing arr stack (shown for the mount convention; keep your own definitions) ----
  request app:
    <<: *common
    image: ghcr.io/request app-team/request app:latest
    ports: ["5055:5055"]
    volumes:
      - ./config/request app:/app/config

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    volumes:
      - ./config/prowlarr:/config

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    volumes:
      - ./config/sonarr:/config
      - /data:/data

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    volumes:
      - ./config/radarr:/config
      - /data:/data

  download client:
    <<: *common
    image: lscr.io/linuxserver/download client:latest
    volumes:
      - ./config/download client:/config
      - /data/torrents:/data/torrents
